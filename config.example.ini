; Ambient AI example configuration
; Copy this file to config.ini, then replace model names and paths with presets
; that exist in models_preset.ini. Boolean values are true or false.

[runtime]
; llama.cpp router base URL. It must expose /v1, /models, /models/load,
; /models/unload, and model-scoped /health endpoints.
api_base_url = http://127.0.0.1:8080
; Must match --api-key on llama-server. Do not put a production secret in Git.
api_key = testkey
; Maximum total time for router loading plus model-scoped health readiness.
model_load_timeout_seconds = 600
; Default maximum tokens any LLM request may generate before the server stops it.
; Per-call tighter limits still override this. Set to a lower value to stop
; runaway outputs sooner.
max_generation_tokens = 60000
; Safe fallback model when a specialized role below has no configured value.
default_model = 
; All databases, plain captures, chat history, and runtime state live here.
user_data_dir = .ambient_data
; Seconds without keyboard/mouse input before the user is considered idle.
; Idle changes resource priority; it does not create intent or start work alone.
user_idle_threshold_seconds = 20
; MCP server definition file. Set blank to start without MCP tools.
mcp_config_path = mcp.json
; Enables verbose diagnostic logging. Avoid this for normal private use.
debug_mode = false
; Legacy compatibility setting. The durable coordinator evaluates context continuously.
always_on = false
; Legacy queue behavior. Keep false; scheduled work uses the policy gateway.
perform_queue_tasks = false

[vision_runtime]
; The passive observer uses the same llama.cpp router as [runtime] by default.
; Leave this blank for the normal single-server setup on port 8080. An override
; remains available for unusual deployments, but a second server is not required.
api_base_url =
api_key =
; With keep_resident=true, preload the passive VLM at startup and pin it in VRAM.
preload = true
; Set false to unload the passive VLM after every processed screenshot so other
; models can reclaim its VRAM. The shared router still needs --models-max 2 when true.
keep_resident = true
model_load_timeout_seconds = 600

[models]
; Small text-only model kept resident when memory is healthy. Prefer <=1.5B Q4,
; or a similarly small model such as 0.8B Q8. Leave blank for on-demand chat.
lightweight_chat_model =
; Small non-thinking VLM kept ready for bounded screenshot perception.
passive_observer_model = Ambient-Fast-Vision
; Larger VLM for difficult screenshots. It remains unloaded unless explicitly selected.
full_passive_observer_model = 
; Text model for follow-up reasoning about an existing visual observation.
passive_followup_model =
; Text model that updates profile facts and preferences from confirmed evidence.
user_biodata_model = 
; Main judgment/research model for qualifying proactive opportunities.
followup_execution_model = 
; Model used to turn completed work into user-facing reports.
reporter_model = 
; Model for explicit Todoist tasks when that integration is enabled.
todoist_execution_model = 
; Model for optional memory reflection work.
reflection_model = 
; Model for reasoning over transcripts after deferred ASR completes.
transcript_processing_model = 
; Vision model temporarily loaded for delegated browser work. Fara1.5-27B is
; recommended when [browser] backend=fara_visual.
browser_agent_model = Fara1.5-27B
; Model temporarily loaded for delegated read-only filesystem work.
filesystem_agent_model =
; Model temporarily loaded only after the user approves computer use in the web UI.
computer_agent_model =
; Normal on-demand chat model. The lightweight model handles ordinary chat first.
chat_model = 

[resource_governor]
; capture_only = capture and queue only; balanced = recommended; aggressive =
; lower safety reserves and more background inference during active use.
preset = balanced
; Evict a resident model when free RAM is below both critical boundaries.
; critical_ram_mb and critical_vram_mb also cap the preset's admission reserves,
; so explicit lower values take precedence over balanced/aggressive defaults.
; Admission uses measured RAM/VRAM before and after loading; there are no per-model estimates.
critical_ram_mb = 2048
critical_ram_percent = 15
critical_vram_mb = 512
; Healthy memory must remain stable this long before the tiny model reloads.
recovery_stable_seconds = 30
; Minimum spacing between automatic load/unload transitions to prevent thrashing.
transition_cooldown_seconds = 60
; Keep the current healthy model resident between work units. It is still
; evicted for critical memory pressure, ASR ownership, shutdown, or a real model switch.
keep_active_model_resident = true
; Maximum duration and event count in one background inference lease.
batch_max_seconds = 90
batch_max_events = 8
; Delay before reconsidering work that was denied because resources were unsafe.
defer_seconds = 30
; Maximum queued audio duration transcribed in one ASR resource window.
asr_batch_audio_seconds = 300

[accelerator]
; auto detects ROCm, CUDA, or CPU through PyTorch. ROCm still uses torch device "cuda".
backend = auto
; Set true in a hackathon ROCm profile so unsupported/unknown Radeon GPUs fail preflight.
require_supported_gpu = false
torch_device = auto
telemetry_provider = auto

[browser]
; fara_visual uses screenshots and pixel coordinates only. playwright_mcp is
; retained as a temporary compatibility backend.
backend = fara_visual
; fara = Fara1.5 prompt/schema. qwen_generic = strict generic visual-agent prompt.
agent_family = fara
; MCP server name used only when backend=playwright_mcp.
server_name = playwright
; Hard timeout for one delegated browser task.
task_timeout_seconds = 900
; Keep false for a visible, locally controllable research browser.
headless = false
; Use a dedicated profile. Never point this at your normal signed-in profile.
persistent_profile_dir = .ambient_data/browser/research-profile
screenshot_dir = .ambient_data/browser/screenshots
viewport_width = 1440
viewport_height = 900
max_steps = 100
settle_ms = 700
search_url_template = https://duckduckgo.com/?q={query}
; Leave channel and executable_path blank to use Playwright's bundled Chromium.
channel =
executable_path =
; Retained screenshots provide an audit trail. Disable to delete them after each task.
retain_screenshots = true
; Deprecated compatibility settings. The Fara visual browser no longer blocks
; requests by domain, path, or HTTP method. Downloads remain disabled/cancelled.
blocked_domains_json = []
blocked_path_markers_json = []
; Legacy MCP-only tools that must never be exposed to its generic agent.
denied_tools_json = ["browser_run_code", "browser_run_code_unsafe"]

[filesystem]
; Hard timeout for one delegated read-only filesystem task.
task_timeout_seconds = 120
; Maximum bytes read from any one file.
max_read_bytes = 256000
; Maximum directory entries or search matches returned per tool call.
max_list_entries = 200
; Reserved for future write support. v1 remains read-only.
allow_writes = false

[computer]
; Computer use is disabled unless explicitly enabled, and still requires web UI approval per task.
enabled = false
; gemma = normalized 0..1000 prompt. ui_tars = UI-TARS-style executor prompt.
; qwen_generic = strict generic visual desktop-agent prompt.
agent_family = gemma
; Hard timeout for one approved computer-use task.
task_timeout_seconds = 180
; Maximum desktop actions before the session stops.
max_actions_per_task = 40
; Screenshots captured for each computer-use model turn.
screenshot_dir = .ambient_data/computer/screenshots
; Emergency stop combo for the active computer-use session only.
emergency_stop_combo = shift+esc

[chat]
; Durable dashboard conversation database.
db_path = .ambient_data/database/chat.db
; Maximum completed messages inserted into a new model prompt.
history_message_limit = 40
; How often partial streamed responses are checkpointed to SQLite.
stream_checkpoint_seconds = 0.25

[passive_observer]
; Enables lightweight active-use screen capture. No VLM is loaded by capture itself.
enabled = false
; Legacy in-memory queue size; durable coordinator mode persists captures directly.
screenshot_queue_maxlen = 180
; Screenshots at or above this similarity are coalesced rather than reprocessed.
ssim_threshold = 0.92
; Number of recent downscaled images used for similarity comparison.
ssim_compare_count = 4
; Seconds between lightweight UI metadata and screenshot captures.
capture_interval_seconds = 10
; Capture UI Automation text/title/URL before deferred vision analysis.
fast_routing_enabled = true
; Similarity boundary used when deciding whether fuller vision analysis is useful.
full_vlm_ssim_threshold = 0.70
; Retry count for malformed fast-observer model responses.
fast_model_retry_count = 0
; The VLM gets 16 seconds, leaving four seconds for image preparation and durable persistence.
processing_budget_seconds = 20
vlm_request_timeout_seconds = 16
max_output_tokens = 256
inference_width = 960
inference_height = 540
inference_jpeg_quality = 82
uiat_text_max_chars = 1200
; High-salience captures are revisited later by the larger VLM without blocking perception.
deep_enrichment_enabled = true
deep_vlm_request_timeout_seconds = 120
deep_max_output_tokens = 768
; Bound burst backlogs without discarding a capture that has already been claimed.
max_pending_per_context = 2
; Group lightweight visual observations before downstream autonomy judgment.
visual_context_batch_size = 5
visual_context_batch_max_wait_seconds = 60
visual_context_batch_flush_high_salience = true
; UI Automation extraction mode used by UIATAdapter.
uiat_mode = screen_content
; Initial screen-only exclusion seed. After first startup, the Web UI is
; authoritative and persists edits under runtime.user_data_dir/privacy.
; Executable names are matched exactly; app names can use the window-title fallback.
ignore_apps_json = ["1Password", "Signal"]
; Initial domain seed. URLs are normalized to hosts and include all subdomains.
ignore_domains_json = ["bank.example"]
; Apps that may use the full vision model when a resource lease permits it.
always_full_apps_json = []
; Domains that may use the full vision model when a resource lease permits it.
always_full_domains_json = []

[ambient]
; These describe enabled durable event sources. Capture controls still take priority.
continuous_transcript_processing = true
continuous_visual_processing = true
; Preferred event grouping size for compatible handlers.
event_batch_size = 2
; Time before a crashed event lease can be reclaimed.
event_lease_seconds = 180
; Upper bound for compatible event handlers.
handler_timeout_seconds = 180
; Per-type backlog ceiling for compatible producers; raw capture files are retained.
max_pending_per_event_type = 120

[autonomy]
; shadow creates proposed inbox cards only; active can research and perform
; policy-permitted reversible actions; disabled stops opportunity processing.
mode = shadow
; Product-level behavior switches retained for policy configuration.
allow_notifications = true
allow_reversible_actions = true
; Timeout and approval lifetime for bounded tools/actions.
tool_timeout_seconds = 45
approval_ttl_minutes = 30
; If a browser-use approval expires without a user decision, run DDGS web search
; instead and resume the original task with those search results. Denied approvals
; do not fallback.
browser_approval_ddgs_fallback_enabled = true
browser_approval_ddgs_fallback_check_seconds = 10
browser_approval_ddgs_fallback_max_results = 8
; Hard rate limits for proactive work.
max_tool_calls_per_hour = 120
max_web_queries_per_day = 60
max_inbox_items_per_day = 30
max_interruptions_per_hour = 2
; Lease/retry values for compatible scheduled task workers.
task_lease_seconds = 600
task_retry_delay_seconds = 30
; Optional initial tool-to-capability mappings. Policy remains authoritative.
tool_policy_rules_json = [{"pattern":"capture_screen","capability":"observe","requires_approval":false},{"pattern":"search*","capability":"observe","requires_approval":false},{"pattern":"get_*","capability":"observe","requires_approval":false},{"pattern":"list_*","capability":"observe","requires_approval":false}]

[llm_interaction]
; Maximum model turns in a tool loop before Ambient forces a final no-tools answer.
max_iterations = 25
; When true, the final turn receives no tools and must summarize/return final output from existing context.
final_turn_recovery_enabled = true

[proactive_autonomy]
; Idle personal-source sweeps are disabled until the local user grants them.
enabled = false
; Set true only after you accept recurring read-only checks of enabled sources.
global_grant = false
; Blank uses followup_execution_model.
model =
enabled_sources = gmail,calendar,browser_research,whatsapp,filesystem
enabled_sources_json = []
filesystem_paths_json = []
; Used by proactive Gmail sweeps for tools that require user_google_email.
user_google_email =
cadence_minutes = 60
max_sweeps_per_day = 8
max_findings_per_sweep = 10
minimum_importance = medium
max_source_seconds = 180
; Proactive source-specific model turn budget. The last turn is reserved for JSON recovery.
max_tool_iterations = 25

[privacy]
; Folder containing ordinary screenshots, audio, transcripts, and payload files.
capture_root = .ambient_data/captures
; Informational retention contract. Captures remain until manually deleted.
raw_retention = indefinite_plain

[artifacts]
; When true, Ambient AI merges related reports into existing artifacts instead of
; always creating new timestamped Markdown files.
organizer_enabled = true
; Number of words from each artifact summary shown to the organizer model.
candidate_summary_words = 50
; Number of candidate artifacts selected from the local registry.
candidate_limit = 8
; Number of candidate artifacts whose full content is shown to the organizer.
full_candidate_limit = 3
; Maximum characters loaded from each existing artifact.
max_existing_artifact_chars = 50000
; Run bounded library-wide deduplication in idle resource windows.
maintenance_enabled = true
; Blank uses the configured reporter model.
maintenance_model =
maintenance_min_changes = 3
maintenance_interval_hours = 24
maintenance_max_clusters_per_run = 3
maintenance_candidate_neighbors = 8
maintenance_confidence_threshold = 0.85
; Duplicate Markdown files are moved here; they are never automatically deleted.
archive_dir = archived

[integrations]
; OAuth client and token locations. Secrets should live outside the repository.
google_credentials_path = credentials.json
google_token_path = .ambient_data/integrations/google_token.pickle

[audio]
; Hugging Face token for gated diarization models; environment/credential storage is safer.
hf_token =
; VAD-created audio segments arrive here before being moved to the capture folder.
uploads_dir = .ambient_data/uploads
; Final transcript output directory before it is moved to the capture folder.
transcriptions_dir = .ambient_data/transcriptions
; Audio preprocessing output and temporary working directories.
cleaned_audio_dir = .ambient_data/cleaned_audio
temp_audio_dir = .ambient_data/temp_audio
; Speaker identity database.
voice_db = .ambient_data/database/voice_database.db
; Whisper/CTranslate2 model path used by deferred ASR.
hin2hinglish_model = Hin2Hinglish-ct2/
; Whisper is the default ASR family. whisper_auto uses faster-whisper when installed.
; On ROCm, install faster-whisper through scripts/install_requirements.py so CTranslate2
; is the official ROCm wheel before faster-whisper is installed.
; Explicit alternatives: faster_whisper, ctranslate2_rocm, ctranslate2_cpu, whisper_cpu, llamacpp_qwen.
asr_backend = whisper_auto
asr_device = auto
forced_aligner_device = auto
; On Windows ROCm, keep these CPU unless you have validated their PyTorch kernels locally.
preprocessor_device = auto
diarization_device = auto
speaker_device = auto
; Audio chunks shorter than this many seconds are ignored for speaker matching.
min_time_threshold = 0.2

[realtime_audio]
; Must match audio.uploads_dir so the watcher receives completed VAD segments.
uploads_dir = .ambient_data/uploads

[todoist]
; Enable only after TODOIST_API_TOKEN is provided outside this file.
enabled = false
api_token =
project_name = Ambient AI Tasks
project_state_path = .ambient_data/todoist.json

[web_search]
; DDGS requires no API key. Set DDGS_PROXY in the MCP server environment when needed.
ddgs_timeout_seconds = 10
ddgs_proxy =
ddgs_region = us-en
ddgs_safesearch = moderate
ddgs_backend = auto

[reflection]
; Optional periodic memory consolidation/task shaping. It is resource-gated.
enabled = false
; daily, interval_hours, or every_idle_cycle.
cadence_mode = daily
interval_hours = 24
max_generated_tasks = 8
max_task_generation_runs = 3
history_path = .ambient_data/reflection/reflection_history.json

[home]
; Live activity cards never require a model. The cached narrative digest is
; regenerated after meaningful work during an idle resource window.
enabled = true
; Empty uses models.reporter_model.
model =
refresh_cooldown_minutes = 15
max_items_per_source = 30
; Cancel an unresponsive digest generation and retry later instead of leaving
; Home in a permanent refreshing state.
generation_timeout_seconds = 300

[semantic_memory]
; Requires an embedding/reranker server. Keep false for the lowest memory usage.
enabled = false
embedding_api_base_url = http://127.0.0.1:8081
embedding_model = EmbeddingGemma
reranker_api_base_url = http://127.0.0.1:8081
reranker_model = JinaReranker
; Candidate count before reranking, result count after reranking, and sync batch size.
vector_limit = 12
rerank_limit = 6
sync_batch_size = 32
; Network timeout for embedding/reranking calls. Local rerank models can take
; 10-60s depending on document count, model load state, and GPU/CPU backend.
timeout_seconds = 60
; VRAM protection for systems that cannot keep the main LLM, embedding model,
; and reranker model loaded at the same time.
unload_main_llm_for_embedding = false
unload_main_llm_for_rerank = false
; If true, reloads the previously unloaded main LLM after each semantic call.
; Keep false on constrained VRAM systems; the next LLM task will load on demand.
restore_main_llm_after_semantic = false

[personalization]
; Builds adaptive prompt context from USER_INFO.md, MEMORY.md, and relevant semantic user memories.
enabled = true
stable_profile_chars = 3000
working_memory_chars = 3000
semantic_limit = 8
prompt_context_chars = 8000
include_recent_context_legacy = true
; Run the user biodata extractor after this many processed transcript/screen context events.
biodata_update_event_interval = 3

[semantic_dedupe]
; Optional model-backed deduplication. Durable ambient capture already performs
; deterministic fingerprint/SSIM coalescing, so false saves memory.
enabled = false
; Leave blank to use runtime.default_model when enabled.
model =
candidate_limit = 8
default_ttl_seconds = 86400
debug_log_reasoning = false

[real_world_tests]
; Audio scenarios can still run the explicit full proactive tail.
full_proactive_loop = true
; Image scenarios replace only app.py's live capture source. After the final
; supplied image, advance a bounded number of normal idle work units so due
; reflection and queued work can be observed in a finite test.
post_replay_idle_cycles = 3
max_future_actions = 1
semantic_sync_batches = 4

[log_api]
; Local dashboard/API server. It has no login and refuses non-loopback binds.
enabled = true
; Keep this on loopback. Other host values are rejected at startup.
host = 127.0.0.1
port = 8765
; Number of recent log entries kept in memory for dashboard streaming.
buffer_size = 2000

[benchmarking]
; Benchmark results database and case definition directory.
db_path = .ambient_data/database/benchmarking.db
cases_root = benchmarking/cases

[rocm_tuning]
; Tuning never starts automatically. Run scripts/tune_llama_rocm.py or call the local API.
enabled = true
data_root = .ambient_data/rocm
llama_server_path =
tuning_port = 8091
api_key = testkey
; Each model needs a display name and GGUF path. mmproj is optional for text-only models.
models_json = []
contexts_json = [8192, 16384, 32768]
gpu_layers_json = [99, 80, 60]
flash_attention_json = [true, false]
kv_cache_json = [["q8_0", "q8_0"], ["q4_0", "q4_0"]]
warmups = 1
measured_runs = 10
min_free_vram_mb = 512
prompt = Summarize how ambient AI should behave safely and usefully in five concise bullets.

[training_data]
; Human-reviewed interaction/training export root and metadata database.
root = .ambient_data/training
db_path = .ambient_data/training/database/training_data.db
