; Copy config.example.ini to config.ini, then apply these ROCm-focused values.
; This file is intentionally a small profile note, not a standalone full config.

[accelerator]
backend = amd_rocm
require_supported_gpu = true
torch_device = cuda
telemetry_provider = auto

[audio]
; Whisper remains the default ASR family on ROCm/cloud.
; ctranslate2_rocm validates that CTranslate2 can run on ROCm device="cuda"
; before loading faster-whisper.
asr_backend = ctranslate2_rocm
asr_device = cuda
forced_aligner_device = cuda
preprocessor_device = cpu
diarization_device = cpu
speaker_device = cpu

[semantic_memory]
; Enable when a local llama.cpp-compatible embedding server is running on ROCm.
enabled = true
embedding_api_base_url = http://127.0.0.1:8081
embedding_model = EmbeddingGemma
reranker_api_base_url = http://127.0.0.1:8081
reranker_model = JinaReranker
vector_limit = 12
rerank_limit = 6
sync_batch_size = 32
timeout_seconds = 5
