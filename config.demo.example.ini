; Redacted profile for the AMD Radeon Hackathon demo. Copy selected values into
; your private config.ini; do not store API keys, tokens, personal email, or
; private paths in this file.

[runtime]
api_base_url = http://127.0.0.1:8080
model_load_timeout_seconds = 600
max_generation_tokens = 60000
llm_stream_retry_attempts = 3
llm_stream_retry_delay_seconds = 1.0
parallel_chat_enabled = true
parallel_chat_reserve_slots = 1
parallel_chat_use_loaded_model = true
user_data_dir = .ambient_data/demo
user_idle_threshold_seconds = 10

[accelerator]
backend = amd_rocm
require_supported_gpu = true

[models]
chat_model = Qwen3.6-35B
followup_execution_model = Qwen3.6-35B
reporter_model = Qwen3.6-35B
browser_agent_model = Qwen3.6-35B
computer_agent_model = Qwen3.6-35B
passive_observer_model = Ambient-Fast-Vision

[vision_runtime]
preload = true
keep_resident = true
model_load_timeout_seconds = 600

[passive_observer]
enabled = true
capture_interval_seconds = 10
visual_context_batch_size = 5
visual_context_batch_max_wait_seconds = 60
processing_budget_seconds = 20
vlm_request_timeout_seconds = 16

[semantic_memory]
enabled = true
embedding_api_base_url = http://127.0.0.1:8081
reranker_api_base_url = http://127.0.0.1:8081
timeout_seconds = 60

[audio]
asr_backend = ctranslate2_rocm
asr_device = auto

[autonomy]
mode = active
allow_notifications = true
allow_reversible_actions = true
approval_ttl_minutes = 30

[proactive_autonomy]
enabled = true
global_grant = true
enabled_sources = gmail,calendar,browser_research,filesystem
; Windows absolute roots granted to the read-only filesystem source.
filesystem_paths_json = ["C:\\Users\\Kartikeya Srivastava\\Documents","C:\\Users\\Kartikeya Srivastava\\Desktop","C:\\Users\\Kartikeya Srivastava\\Downloads","D:\\projects\\ambient_ai"]
; Set your real address only in private config.ini.
user_google_email =
cadence_mode = once_per_day

[browser]
backend = fara_visual
agent_family = qwen_generic
headless = false
persistent_profile_dir = .ambient_data/demo/browser/research-profile
retain_screenshots = true

[computer]
enabled = true
agent_family = qwen_generic
emergency_stop_combo = shift+esc

[recurring_tasks]
enabled = true
idle_screen_monitoring_enabled = true

[artifacts]
organizer_enabled = true
maintenance_enabled = true

[home]
enabled = true

[documents]
; Point only to a non-sensitive demo folder in private config.ini.
allowed_paths_json = ["D:/AmbientDemoOutput"]
